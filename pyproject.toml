[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-mujoco-pick-place"
version = "0.1.0"
description = "A small SO-101 MuJoCo pick-and-place teaching project with joint control, Jacobian IK, waypoint recording, and replay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
#  "mujoco>=3.3,<4",
#  "numpy>=1.24",
]

[project.scripts]
so101-mujoco-pick-place = "so101_mujoco_pick_place.app:main"

[tool.setuptools.packages.find]
where = ["src"]
